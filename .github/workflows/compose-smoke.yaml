name: compose-smoke

# Checks that the Docker Compose self-host setup actually works:
#   fresh-install - setup.sh --quick, then API smoke (tests/smoke.sh) and a browser smoke (tests/ui)
#   upgrade       - install the previous version, create data, upgrade the way a user
#                   does (new config + setup.sh), check the data is still there
#
# Triggers:
#   pull_request / push to main       - version from .template.huly.conf; upgrade runs
#                                       when the PR changes HULY_VERSION
#   workflow_dispatch                 - test any version, optionally upgrading from another
#   repository_dispatch platform-release (client_payload.version) - sent by the platform
#                                       repo after it pushes release images

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.client_payload.version || inputs.huly_version || '' }}
  cancel-in-progress: true

on:
  pull_request:
    paths-ignore: ['kube/**', 'helm/**', '**.md', 'guides/**']
  push:
    branches: [main]
    paths-ignore: ['kube/**', 'helm/**', '**.md', 'guides/**']
  workflow_dispatch:
    inputs:
      huly_version:
        description: 'Version to test (e.g. v0.7.430); empty = the one in .template.huly.conf'
        required: false
      upgrade_from:
        description: 'Also test upgrading from this version (e.g. v0.7.426); empty = skip'
        required: false
  repository_dispatch:
    types: [platform-release]

permissions:
  contents: read

env:
  HULY_URL: http://localhost:8087
  # version under test: dispatch payload > manual input > empty (use the template)
  TARGET_VERSION: ${{ github.event.client_payload.version || inputs.huly_version || '' }}

jobs:
  fresh-install:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Pin version under test
        if: env.TARGET_VERSION != ''
        run: sed -i "s/^HULY_VERSION=.*/HULY_VERSION=${TARGET_VERSION}/" .template.huly.conf

      - name: Install (setup.sh --quick)
        run: |
          grep '^HULY_VERSION=' .template.huly.conf
          ./setup.sh --quick < /dev/null

      - name: API smoke test
        run: tests/smoke.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Browser smoke test
        working-directory: tests/ui
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Restart survives
        run: |
          docker compose restart
          tests/smoke.sh --verify

      - name: Collect logs
        if: always()
        run: |
          mkdir -p logs
          docker compose ps -a > logs/ps.txt 2>&1 || true
          for s in $(docker compose config --services); do
            docker compose logs --no-color "$s" > "logs/$s.log" 2>&1 || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-install-logs
          path: |
            logs/
            tests/ui/playwright-report/
            tests/ui/test-results/

  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: new
          fetch-depth: 0

      - name: Decide versions
        id: v
        working-directory: new
        env:
          UPGRADE_FROM: ${{ inputs.upgrade_from || '' }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          to=${TARGET_VERSION:-$(sed -n 's/^HULY_VERSION=//p' .template.huly.conf)}
          from_ref=HEAD
          from=$UPGRADE_FROM
          if [ -z "$from" ] && [ "$EVENT" = pull_request ]; then
            # the config users have today = the base branch
            from_ref=$BASE_SHA
            from=$(git show "$from_ref:.template.huly.conf" | sed -n 's/^HULY_VERSION=//p')
          elif [ -z "$from" ] && [ -n "$TARGET_VERSION" ]; then
            # new platform release: upgrade from what this repo pins now
            from=$(sed -n 's/^HULY_VERSION=//p' .template.huly.conf)
          fi
          [ "$from" = "$to" ] && from=
          { echo "from=$from"; echo "from_ref=$from_ref"; echo "to=$to"; } >> "$GITHUB_OUTPUT"
          echo "Upgrade: ${from:-<skip>} -> $to (old config from $from_ref)"

      - name: Free disk space
        if: steps.v.outputs.from != ''
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install old version
        if: steps.v.outputs.from != ''
        run: |
          git -C new worktree add ../old ${{ steps.v.outputs.from_ref }}
          cd old
          # the smoke tests themselves always come from the new checkout
          rm -rf tests && cp -r ../new/tests .
          sed -i "s/^HULY_VERSION=.*/HULY_VERSION=${{ steps.v.outputs.from }}/" .template.huly.conf
          ./setup.sh --quick < /dev/null

      - uses: actions/setup-node@v4
        if: steps.v.outputs.from != ''
        with:
          node-version: 22

      - name: Create data on old version
        if: steps.v.outputs.from != ''
        working-directory: old
        run: |
          tests/smoke.sh
          cd tests/ui
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Upgrade the way a user does
        if: steps.v.outputs.from != ''
        run: |
          # keep secrets and test state, take the new config, re-run setup
          cp old/.huly.secret old/.cr.secret old/.rp.secret new/
          cp old/tests/.smoke-state old/tests/.smoke-ui-state new/tests/
          cd new
          [ -n "$TARGET_VERSION" ] && sed -i "s/^HULY_VERSION=.*/HULY_VERSION=${TARGET_VERSION}/" .template.huly.conf
          (cd ../old && docker compose down)   # without -v: data volumes are kept
          ./setup.sh --quick < /dev/null

      - name: Data survived the upgrade
        if: steps.v.outputs.from != ''
        working-directory: new
        run: |
          tests/smoke.sh --verify
          cd tests/ui
          npm ci
          SMOKE_MODE=verify npx playwright test

      - name: Everything still works for new users
        if: steps.v.outputs.from != ''
        working-directory: new
        run: tests/smoke.sh

      - name: Collect logs
        if: always() && steps.v.outputs.from != ''
        working-directory: new
        run: |
          mkdir -p logs
          docker compose ps -a > logs/ps.txt 2>&1 || true
          for s in $(docker compose config --services); do
            docker compose logs --no-color "$s" > "logs/$s.log" 2>&1 || true
          done

      - uses: actions/upload-artifact@v4
        if: always() && steps.v.outputs.from != ''
        with:
          name: upgrade-logs
          path: |
            new/logs/
            old/tests/ui/playwright-report/
            new/tests/ui/playwright-report/
            new/tests/ui/test-results/
