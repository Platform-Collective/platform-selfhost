name: compose-smoke

# Checks that the Docker Compose self-host setup actually works:
#   fresh-install - setup.sh --quick, then API smoke (tests/smoke.sh) and a browser smoke (tests/ui),
#                   once per supported database (CockroachDB and PostgreSQL)
#   upgrade       - install the previous version, create data, upgrade the way a user
#                   does (new config + setup.sh), check the data is still there
#                   (CockroachDB: the database every existing install runs)
#
# Triggers:
#   pull_request / push to main       - version from .template.huly.conf; upgrade runs
#                                       when the PR changes HULY_VERSION
#   workflow_dispatch                 - test any version, optionally upgrading from another
#   repository_dispatch platform-release (client_payload.version) - sent by the platform
#                                       repo after it pushes release images

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.client_payload.version || inputs.huly_version || '' }}
  cancel-in-progress: true

on:
  pull_request:
    paths-ignore: ['kube/**', 'helm/**', '**.md', 'guides/**']
  push:
    branches: [main]
    paths-ignore: ['kube/**', 'helm/**', '**.md', 'guides/**']
  workflow_dispatch:
    inputs:
      huly_version:
        description: 'Version to test (e.g. v0.7.430); empty = the one in .template.huly.conf'
        required: false
      upgrade_from:
        description: 'Also test upgrading from this version (e.g. v0.7.426); empty = skip'
        required: false
  repository_dispatch:
    types: [platform-release]

permissions:
  contents: read

env:
  HULY_URL: http://localhost:8087
  # version under test: dispatch payload > manual input > empty (use the template)
  TARGET_VERSION: ${{ github.event.client_payload.version || inputs.huly_version || '' }}

jobs:
  fresh-install:
    name: fresh-install (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        db: [cockroach, postgres]
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Pin version under test
        if: env.TARGET_VERSION != ''
        run: sed -i "s/^HULY_VERSION=.*/HULY_VERSION=${TARGET_VERSION}/" .template.huly.conf

      - name: Install (setup.sh --quick --db ${{ matrix.db }})
        run: |
          grep '^HULY_VERSION=' .template.huly.conf
          ./setup.sh --quick --db ${{ matrix.db }} < /dev/null

      - name: API smoke test
        run: tests/smoke.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Browser smoke test
        working-directory: tests/ui
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Restart survives
        run: |
          docker compose restart
          tests/smoke.sh --verify

      - name: Services recreated behind a running nginx
        run: |
          # recreated containers get new IPs; nginx must follow them without a restart
          ip() { docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$(docker compose ps -q "$1")"; }
          before="account=$(ip account) transactor=$(ip transactor)"
          docker compose up -d --force-recreate --no-deps account transactor
          echo "IPs: $before -> account=$(ip account) transactor=$(ip transactor)"
          tests/smoke.sh --verify

      - name: Backup and restore keep the data
        run: |
          ./backup.sh
          backup=$(ls -d backups/huly-backup-* | tail -1)
          grep -q "${{ matrix.db }}.tar.gz" "$backup/manifest.txt"
          ./restore.sh "$backup" --yes
          tests/smoke.sh --verify

      - name: Report failure
        if: failure()
        run: tests/ci-report.sh

      - name: Collect logs
        if: always()
        run: |
          mkdir -p logs
          docker compose ps -a > logs/ps.txt 2>&1 || true
          for s in $(docker compose config --services); do
            docker compose logs --no-color "$s" > "logs/$s.log" 2>&1 || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-install-${{ matrix.db }}-logs
          path: |
            logs/
            tests/ui/playwright-report/
            tests/ui/test-results/

  traefik:
    # The Traefik setup (compose.traefik.yml + traefik/setup.sh) on a fresh install:
    # TLS with a certificate from a throwaway CA (Let's Encrypt is not reachable from CI),
    # API smoke through https, HTTP->HTTPS redirect, dashboard behind a login, nginx not published.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HULY_URL: https://huly.test
      DASHBOARD_PASSWORD: ci-dashboard-password
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Pin version under test
        if: env.TARGET_VERSION != ''
        run: sed -i "s/^HULY_VERSION=.*/HULY_VERSION=${TARGET_VERSION}/" .template.huly.conf

      - name: Test domain and certificate
        run: |
          echo "127.0.0.1 huly.test" | sudo tee -a /etc/hosts
          mkdir -p /tmp/ca
          cd /tmp/ca
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=CI test CA" \
            -keyout ca.key -out ca.crt
          openssl req -newkey rsa:2048 -nodes -subj "/CN=huly.test" -keyout huly.key -out huly.csr
          printf 'subjectAltName=DNS:huly.test\nextendedKeyUsage=serverAuth\n' > ext.cnf
          openssl x509 -req -in huly.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 2 \
            -extfile ext.cnf -out huly.crt
          sudo cp ca.crt /usr/local/share/ca-certificates/ci-test-ca.crt
          sudo update-ca-certificates

      - name: Install (setup.sh --quick), then switch to the test domain over SSL
        run: |
          ./setup.sh --quick < /dev/null
          # what a user answers in the interactive setup.sh: domain + SSL
          sed -i -e 's/^HOST_ADDRESS=.*/HOST_ADDRESS=huly.test/' -e 's/^SECURE=.*/SECURE=true/' huly_v7.conf

      - name: Configure Traefik (traefik/setup.sh)
        env:
          TRAEFIK_TLS: files
          TRAEFIK_CERT: /tmp/ca/huly.crt
          TRAEFIK_KEY: /tmp/ca/huly.key
          TRAEFIK_DASHBOARD: 'yes'
          DASHBOARD_USER: admin
          TRAEFIK_START: 'yes'
        run: |
          traefik/setup.sh < /dev/null
          grep '^COMPOSE_FILE=' huly_v7.conf
          docker compose ps

      - name: API smoke test through Traefik
        run: tests/smoke.sh

      - name: Traefik routing and protection
        run: |
          set -x
          # HTTP is redirected to HTTPS
          code=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' http://huly.test/)
          [[ "$code" =~ ^30[178]\ https://huly.test/ ]]
          # the dashboard needs a login
          [ "$(curl -s -o /dev/null -w '%{http_code}' https://huly.test:8443/dashboard/)" = 401 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -u admin:wrong https://huly.test:8443/dashboard/)" = 401 ]
          [ "$(curl -s -o /dev/null -w '%{http_code}' -u "admin:$DASHBOARD_PASSWORD" https://huly.test:8443/dashboard/)" = 200 ]
          # the Traefik API is not served on the platform port (/api there belongs to the front)
          if curl -s https://huly.test/api/http/routers | grep -q 'api@internal'; then
            echo "::error::Traefik API is exposed on https://huly.test/api"; exit 1
          fi
          # the bundled nginx is no longer published on HTTP_PORT
          if curl -s --max-time 5 -o /dev/null http://localhost:8087/; then
            echo "::error::nginx is still published on localhost:8087"; exit 1
          fi

      - name: setup.sh re-run keeps Traefik enabled
        run: |
          # re-running setup.sh regenerates huly_v7.conf; the override must survive it
          # (--quick resets the host to localhost, so only the config is checked, not the stack)
          cp huly_v7.conf /tmp/huly_v7.conf.bak
          ./setup.sh --quick < /dev/null >/dev/null 2>&1 || true
          grep -q '^COMPOSE_FILE=.*compose.traefik.yml' huly_v7.conf
          cp /tmp/huly_v7.conf.bak huly_v7.conf

      - name: The override also composes with PostgreSQL
        run: COMPOSE_FILE=compose.yml:compose.postgres.yml:compose.traefik.yml docker compose config -q

      - name: Report failure
        if: failure()
        run: tests/ci-report.sh

      - name: Collect logs
        if: always()
        run: |
          mkdir -p logs
          docker compose ps -a > logs/ps.txt 2>&1 || true
          cp -r traefik/config logs/traefik-config 2>/dev/null || true
          for s in $(docker compose config --services); do
            docker compose logs --no-color "$s" > "logs/$s.log" 2>&1 || true
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: traefik-logs
          path: logs/

  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          path: new
          fetch-depth: 0

      - name: Decide versions
        id: v
        working-directory: new
        env:
          UPGRADE_FROM: ${{ inputs.upgrade_from || '' }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          to=${TARGET_VERSION:-$(sed -n 's/^HULY_VERSION=//p' .template.huly.conf)}
          from_ref=HEAD
          from=$UPGRADE_FROM
          if [ -z "$from" ] && [ "$EVENT" = pull_request ]; then
            # the config users have today = the base branch
            from_ref=$BASE_SHA
            from=$(git show "$from_ref:.template.huly.conf" | sed -n 's/^HULY_VERSION=//p')
          elif [ -z "$from" ] && [ -n "$TARGET_VERSION" ]; then
            # new platform release: upgrade from what this repo pins now
            from=$(sed -n 's/^HULY_VERSION=//p' .template.huly.conf)
          fi
          [ "$from" = "$to" ] && from=
          { echo "from=$from"; echo "from_ref=$from_ref"; echo "to=$to"; } >> "$GITHUB_OUTPUT"
          echo "Upgrade: ${from:-<skip>} -> $to (old config from $from_ref)"

      - name: Free disk space
        if: steps.v.outputs.from != ''
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install old version
        if: steps.v.outputs.from != ''
        run: |
          git -C new worktree add ../old ${{ steps.v.outputs.from_ref }}
          cd old
          # the smoke tests themselves always come from the new checkout
          rm -rf tests && cp -r ../new/tests .
          sed -i "s/^HULY_VERSION=.*/HULY_VERSION=${{ steps.v.outputs.from }}/" .template.huly.conf
          ./setup.sh --quick < /dev/null

      - uses: actions/setup-node@v4
        if: steps.v.outputs.from != ''
        with:
          node-version: 22

      - name: Create data on old version
        if: steps.v.outputs.from != ''
        working-directory: old
        run: |
          tests/smoke.sh
          cd tests/ui
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Upgrade the way a user does
        if: steps.v.outputs.from != ''
        run: |
          # keep secrets and test state, take the new config, re-run setup
          cp old/.huly.secret old/.cr.secret old/.rp.secret new/
          cp old/tests/.smoke-state old/tests/.smoke-ui-state new/tests/
          cd new
          [ -n "$TARGET_VERSION" ] && sed -i "s/^HULY_VERSION=.*/HULY_VERSION=${TARGET_VERSION}/" .template.huly.conf
          (cd ../old && docker compose down)   # without -v: data volumes are kept
          ./setup.sh --quick < /dev/null

      - name: Data survived the upgrade
        if: steps.v.outputs.from != ''
        working-directory: new
        run: |
          tests/smoke.sh --verify
          cd tests/ui
          npm ci
          SMOKE_MODE=verify npx playwright test

      - name: Everything still works for new users
        if: steps.v.outputs.from != ''
        working-directory: new
        run: tests/smoke.sh

      - name: Report failure
        if: failure() && steps.v.outputs.from != ''
        working-directory: new
        run: tests/ci-report.sh

      - name: Collect logs
        if: always() && steps.v.outputs.from != ''
        working-directory: new
        run: |
          mkdir -p logs
          docker compose ps -a > logs/ps.txt 2>&1 || true
          for s in $(docker compose config --services); do
            docker compose logs --no-color "$s" > "logs/$s.log" 2>&1 || true
          done

      - uses: actions/upload-artifact@v4
        if: always() && steps.v.outputs.from != ''
        with:
          name: upgrade-logs
          path: |
            new/logs/
            old/tests/ui/playwright-report/
            new/tests/ui/playwright-report/
            new/tests/ui/test-results/
