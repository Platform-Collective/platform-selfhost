
# PostgreSQL variables
PG_DATABASE=${PG_DATABASE}
PG_USERNAME=${PG_USERNAME}
PG_USER_PASSWORD=${PG_SECRET}
PG_DB_URL=postgres://${PG_USERNAME}:${PG_SECRET}@postgres:5432/${PG_DATABASE}
VOLUME_PG_DATA_PATH=${VOLUME_PG_DATA_PATH}

# Makes every `docker compose` command use the PostgreSQL override.
# If you add your own override file, append it here (e.g. ...:compose.override.yml).
COMPOSE_FILE=compose.yml:compose.postgres.yml
